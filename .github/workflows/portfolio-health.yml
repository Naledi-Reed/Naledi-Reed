name: Portfolio Health Check

on:
  push:
  pull_request:

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check profile README
        run: test -s README.md
      - name: Check project documentation
        run: |
          test -d projects
          find projects -maxdepth 2 -name README.md -print
