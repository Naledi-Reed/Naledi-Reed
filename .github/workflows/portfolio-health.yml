name: Portfolio Health Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate portfolio structure
        run: python scripts/portfolio_check.py

      - name: Check project documentation
        shell: bash
        run: |
          echo "Project READMEs found:"
          find projects -maxdepth 2 -name README.md -print | sort
          test "$(find projects -maxdepth 2 -name README.md | wc -l)" -ge 6

      - name: Check security lab roadmap
        run: test -s SOC-LAB-ROADMAP.md
